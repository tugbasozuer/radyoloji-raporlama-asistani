spring.application.name=radyoloji-raporlama-asistani

# --- Veritabani baglantisi ---
# ${DEGISKEN:varsayilan} bicimi: ortam degiskeni tanimliysa onu, degilse ':' sonrasindaki degeri kullanir.
# Varsayilanlar yerel gelistirme icindir (uygulama Mac'te, PostgreSQL Docker'da 5433 portunda).
# Docker Compose ile calisirken bu degerler ortam degiskenleriyle ezilir.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:radyoloji_raporlama_asistani}
spring.datasource.username=${DB_USER:radyoloji_user}
spring.datasource.password=${DB_PASSWORD:radyoloji_dev_pass}

# --- Redis ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# --- JPA / Hibernate ---
# Tablolari Hibernate degil Flyway olusturur/gunceller. Hibernate sadece entity'lerin
# veritabanindaki tablolarla uyumunu dogrular; uyumsuzluk varsa uygulama baslamaz.
spring.jpa.hibernate.ddl-auto=validate
# Veritabani islemleri yalnizca servis katmaninda (@Transactional) yapilsin.
spring.jpa.open-in-view=false

# Flyway icin ek ayar gerekmiyor: Spring Boot varsayilan olarak etkindir ve
# SQL dosyalarini src/main/resources/db/migration altinda arar.


jwt.secret=${JWT_SECRET:gelistirme-ortami-icin-en-az-32-karakterlik-gizli-anahtar-degistir}
jwt.expiration-minutes=480
# Cookie yalnizca HTTPS uzerinden gonderilsin mi? Yerelde (http) false, canlida true olmali.
jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

# Yapay zeka (Anthropic, Spring AI)
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:anahtar-tanimli-degil}
spring.ai.anthropic.chat.model=claude-haiku-5-5
spring.ai.anthropic.chat.max-tokens=1024

# YZ ile Uret icin hiz siniri (kullanici basina, Redis sayaci): pencere suresi icinde en fazla bu kadar istek
ratelimit.ai.max-requests=5
ratelimit.ai.window-seconds=60
