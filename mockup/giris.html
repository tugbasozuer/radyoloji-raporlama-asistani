<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş Yap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="brand">
      <p class="brand-title">Acil Radyoloji Raporlama Asistanı</p>
      <p class="brand-subtitle">Yapay zeka destekli raporlama sistemi</p>
    </div>

    <div class="auth-card">
      <h1>Giriş Yap</h1>
      <form action="rapor-listesi.html" method="get">
        <div class="field">
          <label for="email">E-posta adresi</label>
          <input type="email" id="email" name="email" placeholder="ör. tugba@ornek.com" autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Şifre</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary">Giriş Yap</button>
      </form>
      <div class="auth-switch">
        Hesabınız yok mu? <a href="kayit.html">Kayıt olun</a>
      </div>
    </div>
  </div>
</body>
</html>
